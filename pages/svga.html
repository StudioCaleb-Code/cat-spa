<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
    <defs>
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur1" />
            <feGaussianBlur stdDeviation="8" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Símbolos Geométricos Neón (< O |> ≡ |>) -->
    <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"
        filter="url(#neonGlow)">

        <!-- Símbolo '<' -->
        <path d="M 120 100 L 45 150 L 120 200" />

        <!-- Símbolo 'O' -->
        <circle cx="260" cy="150" r="50" />

        <!-- Símbolo '|>' -->
        <line x1="390" y1="100" x2="390" y2="200" />
        <path d="M 410 100 L 485 150 L 410 200" />

        <!-- Símbolo '≡' -->
        <line x1="580" y1="112" x2="680" y2="112" />
        <line x1="580" y1="150" x2="680" y2="150" />
        <line x1="580" y1="188" x2="680" y2="188" />

        <!-- Símbolo '|>' -->
        <line x1="780" y1="100" x2="780" y2="200" />
        <path d="M 800 100 L 875 150 L 800 200" />

    </g>
</svg>
